- type: entity
  parent: [ BaseMachinePowered, ConstructibleMachine ]
  id: RadiationSynthesizer
  name: radiation synthesizer
  description: "A floor-mounted device for synthesizing gases using radiation."
  components:
  - type: Transform
    anchored: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.25
        mask:
        - Impassable
  - type: ApcPowerReceiver
    powerLoad: 300
  - type: RadiationReceiver
  - type: RadiationSynthesis
#    recipes: <--- example
#    - reactants:
#        Plasma: 1.0
#      products:
#        Tritium: 1.0
#      minRadiation: 10.0
#      minPressure: 0.0
#      maxPressure: 999999999.0
#      minTemperature: 0.0
#      maxTemperature: 999999999.0
#      scaleFactor: 1.0
  - type: Sprite
    sprite: Structures/Machines/holopad.rsi # TODO: replace with my own sprites (in progress)
    drawdepth: HighFloorObjects
    snapCardinals: true
    layers:
    - state: base
    - map: [ "lights" ]
      state: blank
      shader: unshaded
    - map: [ "enum.PowerDeviceVisualLayers.Powered" ]
      state: unpowered
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          False: { visible: true }
          True: { visible: false }
  - type: PointLight
    radius: 1.3
    energy: 1.8
    color: "#afe1fe"
    enabled: false
  - type: AmbientSound
    enabled: false
    volume: -5
    range: 3
    sound:
      path: /Audio/Ambience/Objects/buzzing.ogg
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:ChangeConstructionNodeBehavior
        node: machineFrame
      - !type:DoActsBehavior
        acts: ["Destruction"]
